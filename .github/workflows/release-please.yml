name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      # Checkout code if a release was created
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      # Setup Node.js if a release was created
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Match the npm version used to generate the lockfile (optional peer resolution differs in npm 10).
      - name: Setup npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm install --global npm@11.12.0

      # Install dependencies if a release was created
      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      # Run tests before building/publishing
      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      # Build the package if a release was created
      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      # Publish to npm
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
